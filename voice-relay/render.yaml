services:
  - type: web
    name: corun-voice-relay
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python relay.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: XAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: HUMAN_FALLBACK_NUMBER
        sync: false
