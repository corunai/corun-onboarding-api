<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat with CoRun.ai</title><link rel="icon" href="/logo-site.png">
<link rel="preconnect" href="https://rsms.me/"><link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
:root{--navy:#0D2544;--ink:#142338;--orange:#F77316;--green:#315C4D;--gray:#627080}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:InterVariable,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column}
header{background:var(--navy);padding:14px 20px;display:flex;align-items:center;gap:14px}
header img{height:36px;width:auto}header .t{color:#fff;font-weight:550;font-size:15px;margin-left:auto;text-align:right}
header .t small{display:block;color:#c9d3df;font-weight:400;font-size:12px}
main{flex:1;overflow-y:auto;padding:24px 16px}.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.intro{text-align:center;color:var(--gray);margin:8px 0 12px}.intro h1{color:var(--navy);font-weight:650;font-size:24px;margin:0 0 6px}
.m{max-width:85%;padding:12px 16px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.a{background:#F3F5F8;align-self:flex-start;border-bottom-left-radius:4px}.u{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.n{font-size:12px;font-weight:600;color:var(--orange);margin-bottom:4px}
.typing{color:var(--gray);font-style:italic}
form{border-top:1px solid #e6e9ee;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff}
.row{max-width:760px;margin:0 auto;display:flex;gap:8px}
textarea{flex:1;resize:none;font:inherit;font-size:16px;padding:12px 14px;border:1px solid #d5dbe3;border-radius:12px;outline:none;max-height:140px}
textarea:focus{border-color:var(--navy)}
button{background:var(--orange);color:#fff;border:0;border-radius:12px;padding:0 20px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}#mic,#mute{background:var(--navy);padding:0 14px;font-size:18px}#mic.on{background:var(--orange);animation:p 1s infinite}@keyframes p{50%{box-shadow:0 0 0 6px rgba(247,115,22,.3)}}#vnote{max-width:760px;margin:4px auto 0;font-size:12px;color:var(--gray)}footer{text-align:center;font-size:11px;color:var(--gray);padding:0 0 8px}
</style></head><body>
<header><img src="/logo-reversed.png" alt="CoRun.AI"><div class="t">Violette<small>AI Operations Orchestrator</small></div></header>
<main id="main"><div class="wrap" id="thread"><div class="intro"><h1>Run your fleet with confidence.</h1>Ask CoRun anything. Violette is here to help.</div></div></main>
<form id="f"><div class="row"><textarea id="q" rows="1" placeholder="Ask anything about CoRun…" autofocus></textarea><button type="button" id="mic" title="Talk to Violette" aria-label="Talk">🎤</button><button type="button" id="mute" title="Mute voice replies" aria-label="Mute">🔊</button><button id="b">Send</button></div><div id="vnote"></div></form>
<footer>Violette is one of CoRun's AI software agents. Driven by intelligence. Built around people.</footer>
<script>
const T=document.getElementById('thread'),M=document.getElementById('main'),q=document.getElementById('q'),b=document.getElementById('b');const hist=[];
function add(role,text){const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');if(role!=='user'){const n=document.createElement('div');n.className='n';n.textContent='Violette';d.appendChild(n);}
 const s=document.createElement('span');s.textContent=text;d.appendChild(s);T.appendChild(d);M.scrollTop=M.scrollHeight;return s;}
add('assistant',"Hi, I'm Violette from CoRun.ai. How can I help you today?");
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('f').requestSubmit();}});
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=q.scrollHeight+'px';});
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const t=q.value.trim();if(!t)return;q.value='';q.style.height='auto';add('user',t);hist.push({role:'user',content:t});
 b.disabled=true;const s=add('assistant','Typing…');s.className='typing';
 try{const call=()=>fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:hist})}).then(r=>r.json());let j;try{j=await call();}catch(e){await new Promise(z=>setTimeout(z,2500));j=await call();}
  s.className='';s.textContent=j.reply||j.error;if(j.reply){hist.push({role:'assistant',content:j.reply});speak(j.reply);}}catch{s.className='';s.textContent='Connection problem. Please try again.';}
 b.disabled=false;q.focus();};

let muted=false;const mute=document.getElementById('mute'),mic=document.getElementById('mic'),vn=document.getElementById('vnote');
function speak(t){try{if(muted||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u);}catch(e){}}
mute.onclick=()=>{muted=!muted;mute.textContent=muted?'🔇':'🔊';mute.title=muted?'Unmute voice replies':'Mute voice replies';if(muted&&window.speechSynthesis)speechSynthesis.cancel();};
if(!window.speechSynthesis)mute.style.display='none';
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){mic.style.display='none';vn.textContent='Voice input is not supported in this browser. Try Chrome, Edge or Safari, or type your question.';}
else{const rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=false;let on=false,fin='';
 rec.onstart=()=>{on=true;fin='';mic.classList.add('on');mic.title='Listening… click to stop';vn.textContent='Listening…';if(window.speechSynthesis)speechSynthesis.cancel();};
 rec.onresult=e=>{let i='';for(let k=e.resultIndex;k<e.results.length;k++){const r=e.results[k];if(r.isFinal)fin+=r[0].transcript;else i+=r[0].transcript;}q.value=(fin+i).trim();};
 rec.onerror=e=>{vn.textContent=e.error==='not-allowed'?'Microphone access was blocked. Allow it in your browser to talk.':'Voice input error: '+e.error;};
 rec.onend=()=>{on=false;mic.classList.remove('on');mic.title='Talk to Violette';if(vn.textContent==='Listening…')vn.textContent='';if(q.value.trim())document.getElementById('f').requestSubmit();};
 mic.onclick=()=>{on?rec.stop():rec.start();};}
</script></body></html>
